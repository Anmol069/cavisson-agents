apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deploymentName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.deploymentName }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.deploymentName }}
  template:
    metadata:
      labels:
        app: {{ .Values.deploymentName }}
    spec:
      serviceAccountName: {{ .Values.serviceaccount }}
      containers:
      - name: {{ .Values.deploymentName }}
        command: 
        - /go/bin/ndwebhook
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8443
          name: webhook-api
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 200Mi
        volumeMounts:
        - name: {{ template "webhook-injector.name" . }}-certs
          mountPath: /run/secrets/tls
          readOnly: true
      volumes:
      - name: {{ template "webhook-injector.name" . }}-certs
        secret:
          secretName: {{ template "webhook-injector.name" . }}-certs
