kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: {{ .Values.serviceaccount }}
  namespace: {{ .Values.global.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceaccount }}
roleRef:
  kind: Role
  name: {{ .Values.serviceaccount }}
  apiGroup: rbac.authorization.k8s.io